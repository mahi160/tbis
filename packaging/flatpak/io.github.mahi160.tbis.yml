id: io.github.mahi160.tbis
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tbis
finish-args:
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.ScreenSaver
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
modules:
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    post-install:
      - install -Dm644 COPYING /app/share/licenses/libass/COPYING
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dvulkan=enabled
      - -Dshaderc=enabled
    post-install:
      - install -Dm644 LICENSE /app/share/licenses/libplacebo/LICENSE
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.387.0
        commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dgpl=true
      - -Dbuild-date=false
      - -Dplain-gl=enabled
      - -Dwayland=enabled
      - -Dpulse=enabled
    post-install:
      - install -Dm644 LICENSE.GPL /app/share/licenses/mpv/LICENSE.GPL
      - install -Dm644 LICENSE.LGPL /app/share/licenses/mpv/LICENSE.LGPL
      - install -Dm644 Copyright /app/share/licenses/mpv/Copyright
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3
  - name: tbis
    buildsystem: simple
    build-options:
      prepend-path: /usr/lib/sdk/rust-stable/bin
    build-commands:
      - rustc -Vv
      - cargo build --release --locked --offline
      - install -Dm755 target/release/tbis /app/bin/tbis
      - install -Dm644 LICENSE /app/share/licenses/tbis/LICENSE
      - install -Dm644 packaging/flatpak/io.github.mahi160.tbis.desktop /app/share/applications/io.github.mahi160.tbis.desktop
      - install -Dm644 packaging/flatpak/io.github.mahi160.tbis.metainfo.xml /app/share/metainfo/io.github.mahi160.tbis.metainfo.xml
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/1024x1024/apps/io.github.mahi160.tbis.png
    sources:
      - type: dir
        path: source

[package]
name = "tbis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
gpui-kit = "0.6.6"
gpui-pre-reqwest-client = "0.3.6"
libc = "0.2"
libmpv-sys = "3"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2"
uuid = { version = "1.26.1", features = ["v4"] }

# mpv video surface (src/mpv/mac.rs, ADR-0001)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3"

[build-dependencies]
pkg-config = "0.3.34"

[package]
name = "tbis"
version = "0.3.0"
edition = "2024"
# GPL: the .app bundles Homebrew's GPLv3 libmpv/FFmpeg (ADR-0004)
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
dirs = "6"
futures = "0.3.34"
gpui-kit = "0.7.1"
gpui-pre-reqwest-client = "0.3.6"
libc = "0.2"
libmpv-sys = "3"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2"
uuid = { version = "1.26.1", features = ["v4"] }

# mpv video surface (src/platform/macos/video.rs, ADR-0001)
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-media-player = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3"

# mpv video surface (src/platform/linux/video/wayland.rs, ADR-0001): subsurface + EGL.
# Versions match gpui's, so they share one libwayland binding.
[target.'cfg(target_os = "linux")'.dependencies]
khronos-egl = { version = "6", features = ["dynamic"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client"] }
# sleep inhibit (src/platform/linux/power.rs); already in the tree via gpui's ashpd
zbus = "5"

[build-dependencies]
pkg-config = "0.3.34"

[package]
name = "tbis"
version = "0.6.0"
edition = "2024"
# GPL: the .app bundles Homebrew's GPLv3 libmpv/FFmpeg (ADR-0004)
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
dirs = "6"
futures = "0.3.34"
gpui-kit = "0.8.0"
gpui-pre-reqwest-client = "0.3.9"
libc = "0.2"
libmpv-sys = "3"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
url = "2"
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2"] }

# mpv video surface (src/platform/macos/video.rs, ADR-0001)
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-media-player = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3"

# mpv video surface (src/platform/linux/video/wayland.rs, ADR-0001): subsurface + EGL.
# Versions match gpui's, so they share one libwayland binding.
[target.'cfg(target_os = "linux")'.dependencies]
khronos-egl = { version = "6", features = ["dynamic"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client"] }
# sleep inhibit (src/platform/linux/power.rs); already in the tree via gpui's ashpd
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation", "Media", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_Com",
    "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading",
    "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "=3.0.11"
pkg-config = "0.3.34"

# Shipped builds (scripts/bundle.sh). `release` stays fast for local runs.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
# no runtime code catches panics (gpui only resumes them), so drop unwind tables
panic = "abort"

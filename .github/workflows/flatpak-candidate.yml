name: Flatpak candidate

on:
  push:
    branches: [feat-linux-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Install Freedesktop runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform/x86_64/26.08 \
            org.freedesktop.Sdk/x86_64/26.08 \
            org.freedesktop.Sdk.Extension.rust-stable/x86_64/26.08
      - uses: dtolnay/rust-toolchain@stable
      - name: Build unpublished candidate
        run: sh scripts/build-flatpak-candidate.sh HEAD "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: tbis-flatpak-candidate-x86_64
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error

name: Build Windows dependencies

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an immutable dependency release for this revision (never latest)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-source-dependencies-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the normal pinned-source recipe
        run: ./scripts/build-windows-mpv.ps1
      - name: Archive matched binaries, sources and checksums together
        run: |
          . ./scripts/windows-common.ps1
          $source = Get-WindowsSources
          $package = "$Repo/target/windows-mpv-dependency"
          New-Item -ItemType Directory $package | Out-Null
          Copy-Item "$Deps/mpv", $source $package -Recurse
          Invoke-Native python @("$Repo/scripts/windows_sources.py", 'checksums', '--root', $package, '--output', "$package/SHA256SUMS")
          Invoke-Native python @("$Repo/scripts/windows_sources.py", 'archive', '--root', $package, '--output', "$Repo/target/windows-mpv-dependency.tar", '--prefix', 'windows-mpv-dependency')
          Invoke-Native python @("$Repo/scripts/windows_sources.py", 'checksums', '--root', "$Repo/target/windows-mpv-dependency.tar", '--output', "$Repo/target/SHA256SUMS")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-mpv-dependency
          path: |
            target/windows-mpv-dependency.tar
            target/SHA256SUMS
          if-no-files-found: error
      - name: Publish dedicated immutable dependency release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          . ./scripts/windows-common.ps1
          $tag = "windows-deps-$env:GITHUB_SHA"
          $notes = 'Source-built libmpv dependency, not a product update. The archive contains matched binaries, pinned upstream sources, licenses, recipes, build provenance and SHA256SUMS. This workflow never replaces existing release assets.'
          Invoke-Native gh @('release', 'create', $tag, "$Repo/target/windows-mpv-dependency.tar", "$Repo/target/SHA256SUMS", '--target', $env:GITHUB_SHA, '--title', $tag, '--notes', $notes, '--latest=false')

name: Mirror Windows libmpv

# shinchiro keeps only ~30 days of releases, so the pinned libmpv package is copied
# to a dedicated release here. Run once after changing the pin in scripts/windows-deps.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release=$(jq -r .libmpv.release scripts/windows-deps.json)
          file=$(jq -r .libmpv.file scripts/windows-deps.json)
          sha=$(jq -r .libmpv.sha256 scripts/windows-deps.json)
          upstream=$(jq -r .libmpv.upstream scripts/windows-deps.json)
          tag="libmpv-$release"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already mirrored"
            exit 0
          fi
          curl -fsSL -o "$file" "$upstream"
          echo "$sha  $file" | sha256sum -c -
          gh release create "$tag" "$file" --title "$tag" --latest=false \
            --notes "Mirror of shinchiro/mpv-winbuild-cmake release $release ($file), used to build tbis on Windows. Not a tbis release."

name: Release setup
description: Check out the prepared release revision and set up Python and MSVC

inputs:
  prepared:
    description: Check out the prepared release revision from the release-revision artifact
    default: 'false'
  toolchain:
    description: Set up Python and the MSVC developer environment
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      if: inputs.prepared == 'true'
      with:
        name: release-revision
        path: prepared
    - name: Use prepared release revision
      if: inputs.prepared == 'true'
      shell: bash
      run: |
        git fetch prepared/release.bundle HEAD
        git checkout --detach FETCH_HEAD
    - uses: actions/setup-python@v5
      if: inputs.toolchain == 'true'
      with:
        python-version: '3.12'
        architecture: x64
    - uses: ilammy/msvc-dev-cmd@v1
      if: inputs.toolchain == 'true'
      with:
        arch: x64
